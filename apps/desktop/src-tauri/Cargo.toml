[package]
name = "magnexis-maps-desktop"
version = "0.1.0"
description = "Magnexis Maps desktop shell (Tauri 2)"
authors = ["Magnexis LLC"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "magnexis_maps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
