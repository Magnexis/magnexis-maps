name: ASC TestFlight public link fix

# Raises public-link cap, fills Beta App Review required metadata, submits the
# build for external testing, and forces a fresh Internal invite email.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      TARGET_EMAIL: matthewlooney5@gmail.com
    steps:
      - name: Raise link cap, submit Beta Review, resend invite email
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from urllib.parse import urlencode
          try:
              import jwt
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "PyJWT", "cryptography"])
              import jwt

          key_id = os.environ["ASC_API_KEY_ID"].strip()
          issuer = os.environ["ASC_API_ISSUER_ID"].strip()
          p8 = os.environ["ASC_API_KEY_P8"].replace("\\n", "\n").strip()
          target = os.environ["TARGET_EMAIL"].strip().lower()
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 20 * 60, "aud": "appstoreconnect-v1"},
              p8,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          if isinstance(token, bytes):
              token = token.decode()

          def request(method, path, body=None, params=None, ok_statuses=()):
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urlencode(params)
              data = None
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", "replace")
                  if e.code in ok_statuses:
                      print(f"(ignored HTTP {e.code} on {method} {path})")
                      try:
                          return json.loads(err)
                      except Exception:
                          return {"errors_raw": err}
                  raise SystemExit(f"{method} {url} -> HTTP {e.code}\n{err}") from e

          apps = request("GET", "/v1/apps", params={"limit": "200"})["data"]
          app = next(a for a in apps if a["attributes"].get("bundleId") == "com.magnexis.maps")
          app_id = app["id"]
          print(f"APP={app['attributes']['name']} id={app_id}")

          builds = request("GET", "/v1/builds", params={
              "filter[app]": app_id, "limit": "5", "sort": "-uploadedDate",
          })["data"]
          build = builds[0]
          build_id = build["id"]
          print(f"BUILD number={build['attributes'].get('version')} processing={build['attributes'].get('processingState')} id={build_id}")

          groups = request("GET", "/v1/betaGroups", params={"filter[app]": app_id, "limit": "50"})["data"]
          internal = next(g for g in groups if g["attributes"].get("isInternalGroup"))
          public = next(g for g in groups if g["attributes"].get("name") == "Public Link")
          internal_id = internal["id"]
          public_id = public["id"]

          # 1) Raise public link cap to max (10000)
          print("Raising public link limit to 10000...")
          public = request("PATCH", f"/v1/betaGroups/{public_id}", body={
              "data": {
                  "type": "betaGroups",
                  "id": public_id,
                  "attributes": {
                      "publicLinkEnabled": True,
                      "publicLinkLimitEnabled": True,
                      "publicLinkLimit": 10000,
                  },
              }
          })["data"]
          pa = public["attributes"]
          print(f"LINK limit={pa.get('publicLinkLimit')} enabled={pa.get('publicLinkEnabled')} url={pa.get('publicLink')} code={pa.get('publicLinkId')}")

          # 2) Fill Beta App Review Detail (required for external)
          print("Updating betaAppReviewDetail...")
          detail = request("GET", f"/v1/apps/{app_id}/betaAppReviewDetail", ok_statuses=(404,))
          review_attrs = {
              "contactFirstName": "Matthew",
              "contactLastName": "Looney",
              # Caller-provided contact phone (203-907-6688).
              "contactPhone": "+12039076688",
              "contactEmail": target,
              "demoAccountRequired": False,
              "notes": (
                  "Magnexis Maps TestFlight build. Browse the map, search places, open place details, "
                  "and request a route. Account optional. Production API: https://magnexis-maps.netlify.app"
              ),
          }
          if detail.get("data"):
              did = detail["data"]["id"]
              patched_detail = request("PATCH", f"/v1/betaAppReviewDetails/{did}", body={
                  "data": {"type": "betaAppReviewDetails", "id": did, "attributes": review_attrs}
              }, ok_statuses=(409, 422))
              if patched_detail.get("data"):
                  phone = patched_detail["data"]["attributes"].get("contactPhone")
                  print(f"patched betaAppReviewDetail id={did} contactPhone={phone}")
              else:
                  print("betaAppReviewDetail patch result:", json.dumps(patched_detail, indent=2)[:800])
          else:
              created = request("POST", "/v1/betaAppReviewDetails", body={
                  "data": {
                      "type": "betaAppReviewDetails",
                      "attributes": review_attrs,
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              }, ok_statuses=(409, 422))
              if created.get("data"):
                  phone = created["data"]["attributes"].get("contactPhone")
                  print(f"created betaAppReviewDetail id={created['data']['id']} contactPhone={phone}")
              else:
                  print("betaAppReviewDetail create result:", json.dumps(created, indent=2)[:800])

          # 3) Beta App Description localization (the 422 we hit earlier)
          print("Ensuring betaAppLocalizations description...")
          locs = request("GET", f"/v1/apps/{app_id}/betaAppLocalizations", params={"limit": "50"}).get("data", [])
          desc = (
              "Explore places, discover nearby activity hotspots, keep local favorites, and plan "
              "driving, walking, or cycling routes with Magnexis Maps."
          )
          en = next((l for l in locs if l["attributes"].get("locale", "").startswith("en")), None)
          if en:
              request("PATCH", f"/v1/betaAppLocalizations/{en['id']}", body={
                  "data": {
                      "type": "betaAppLocalizations",
                      "id": en["id"],
                      "attributes": {
                          "description": desc,
                          "feedbackEmail": target,
                          "privacyPolicyUrl": "https://magnexis-maps.netlify.app/privacy/",
                      },
                  }
              })
              print(f"patched localization locale={en['attributes'].get('locale')} id={en['id']}")
          else:
              created = request("POST", "/v1/betaAppLocalizations", body={
                  "data": {
                      "type": "betaAppLocalizations",
                      "attributes": {
                          "locale": "en-US",
                          "description": desc,
                          "feedbackEmail": target,
                          "privacyPolicyUrl": "https://magnexis-maps.netlify.app/privacy/",
                      },
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              })
              print(f"created localization id={created['data']['id']}")

          # Build what-to-test localization
          print("Ensuring betaBuildLocalizations whatsNew...")
          blocs = request("GET", f"/v1/builds/{build_id}/betaBuildLocalizations", params={"limit": "20"}).get("data", [])
          whats = "Initial TestFlight build for Magnexis Maps. Test map, search, place details, and routing."
          ben = next((l for l in blocs if l["attributes"].get("locale", "").startswith("en")), None)
          if ben:
              request("PATCH", f"/v1/betaBuildLocalizations/{ben['id']}", body={
                  "data": {
                      "type": "betaBuildLocalizations",
                      "id": ben["id"],
                      "attributes": {"whatsNew": whats},
                  }
              })
              print(f"patched betaBuildLocalization id={ben['id']}")
          else:
              created = request("POST", "/v1/betaBuildLocalizations", body={
                  "data": {
                      "type": "betaBuildLocalizations",
                      "attributes": {"locale": "en-US", "whatsNew": whats},
                      "relationships": {"build": {"data": {"type": "builds", "id": build_id}}},
                  }
              })
              print(f"created betaBuildLocalization id={created['data']['id']}")

          # Ensure build on public group
          request("POST", f"/v1/betaGroups/{public_id}/relationships/builds", body={
              "data": [{"type": "builds", "id": build_id}]
          }, ok_statuses=(409, 422))

          # 4) Submit for Beta App Review
          print("Submitting Beta App Review...")
          sub = request("POST", "/v1/betaAppReviewSubmissions", body={
              "data": {
                  "type": "betaAppReviewSubmissions",
                  "relationships": {"build": {"data": {"type": "builds", "id": build_id}}},
              }
          }, ok_statuses=(409, 422))
          if sub.get("data"):
              print(f"BETA_REVIEW submitted state={sub['data']['attributes'].get('betaReviewState')} id={sub['data']['id']}")
          else:
              print("BETA_REVIEW submit_result:", json.dumps(sub, indent=2)[:2000])

          review = request("GET", f"/v1/builds/{build_id}/betaAppReviewSubmission", ok_statuses=(404,))
          if review.get("data"):
              print(f"BETA_REVIEW state={review['data']['attributes'].get('betaReviewState')}")
          else:
              print("BETA_REVIEW state=NONE")

          detail2 = request("GET", f"/v1/builds/{build_id}/buildBetaDetail", ok_statuses=(404,))
          if detail2.get("data"):
              da = detail2["data"]["attributes"]
              print(f"externalBuildState={da.get('externalBuildState')} internalBuildState={da.get('internalBuildState')}")

          # 5) Fresh Internal invite WITHOUT deleting the tester (delete revokes old tokens).
          print(f"Ensuring Internal invite for {target}...")
          found = request("GET", "/v1/betaTesters", params={"filter[email]": target, "limit": "10"}).get("data", [])
          tester_id = found[0]["id"] if found else None
          if tester_id:
              print(f"reusing_tester id={tester_id} state={found[0]['attributes'].get('state')}")
              request("POST", f"/v1/betaGroups/{internal_id}/relationships/betaTesters", body={
                  "data": [{"type": "betaTesters", "id": tester_id}]
              }, ok_statuses=(409, 422))
          else:
              created = request("POST", "/v1/betaTesters", body={
                  "data": {
                      "type": "betaTesters",
                      "attributes": {"email": target, "firstName": "Matthew", "lastName": "Looney"},
                      "relationships": {
                          "betaGroups": {"data": [{"type": "betaGroups", "id": internal_id}]},
                      },
                  }
              })
              tester_id = created["data"]["id"]
              print(f"created_internal_tester id={tester_id} state={created['data']['attributes'].get('state')}")

          inv = request("POST", "/v1/betaTesterInvitations", body={
              "data": {
                  "type": "betaTesterInvitations",
                  "relationships": {
                      "app": {"data": {"type": "apps", "id": app_id}},
                      "betaTester": {"data": {"type": "betaTesters", "id": tester_id}},
                  },
              }
          }, ok_statuses=(409,))
          print("invite_post:", json.dumps(inv, indent=2)[:800])

          time.sleep(2)
          testers = request("GET", f"/v1/betaGroups/{internal_id}/betaTesters", params={"limit": "50"}).get("data", [])
          me = next((t for t in testers if (t["attributes"].get("email") or "").lower() == target), None)
          if me:
              print(f"INTERNAL_TESTER email={me['attributes'].get('email')} state={me['attributes'].get('state')} id={me['id']}")
          else:
              print("INTERNAL_TESTER missing from group")

          ibuilds = request("GET", f"/v1/betaGroups/{internal_id}/builds", params={"limit": "10"}).get("data", [])
          print("internal_group_builds:", [b["attributes"].get("version") for b in ibuilds])
          pub_testers = request("GET", f"/v1/betaGroups/{public_id}/betaTesters", params={"limit": "50"}).get("data", [])
          public = request("GET", f"/v1/betaGroups/{public_id}")["data"]["attributes"]
          review_phone = request("GET", f"/v1/apps/{app_id}/betaAppReviewDetail", ok_statuses=(404,))
          phone_saved = None
          if review_phone.get("data"):
              phone_saved = review_phone["data"]["attributes"].get("contactPhone")

          print("\n=== SUMMARY ===")
          print(f"contact_phone_saved={phone_saved}")
          print(f"public_link={public.get('publicLink')}")
          print(f"redeem_code={public.get('publicLinkId')}")
          print(f"link_active={public.get('publicLinkEnabled')}")
          print(f"tester_count={len(pub_testers)}")
          print(f"tester_limit={public.get('publicLinkLimit')}")
          print(f"tester_limit_enabled={public.get('publicLinkLimitEnabled')}")
          if review.get("data"):
              print(f"beta_review={review['data']['attributes'].get('betaReviewState')}")
          else:
              print("beta_review=NONE")
          if detail2.get("data"):
              print(f"external_build_state={detail2['data']['attributes'].get('externalBuildState')}")
              print(f"internal_build_state={detail2['data']['attributes'].get('internalBuildState')}")
          if me:
              print(f"email_invite_state={me['attributes'].get('state')}")
              print(f"email_invite_to={me['attributes'].get('email')}")
          print("WORKING_METHOD=Ignore revoked banners. Use NEW Internal email from Apple, or wait for Beta Review before public link.")
          print("PUBLIC_LINK_NOTE=External install needs APPROVED Beta App Review; Internal works now if invite is accepted.")
          PY
