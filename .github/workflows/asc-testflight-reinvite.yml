name: ASC TestFlight reinvite

# Deletes the stuck INVITED tester, recreates them on the Internal group, and
# creates/enables an External public-link group so a redeem URL/code exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reinvite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      TARGET_EMAIL: matthewlooney5@gmail.com
    steps:
      - name: Reset Internal invite and enable public TestFlight link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from urllib.parse import urlencode
          try:
              import jwt
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "PyJWT", "cryptography"])
              import jwt

          key_id = os.environ["ASC_API_KEY_ID"].strip()
          issuer = os.environ["ASC_API_ISSUER_ID"].strip()
          p8 = os.environ["ASC_API_KEY_P8"].replace("\\n", "\n").strip()
          target = os.environ["TARGET_EMAIL"].strip().lower()
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 20 * 60, "aud": "appstoreconnect-v1"},
              p8,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          if isinstance(token, bytes):
              token = token.decode()

          def request(method, path, body=None, params=None, ok_statuses=()):
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urlencode(params)
              data = None
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", "replace")
                  if e.code in ok_statuses:
                      print(f"(ignored HTTP {e.code} on {method} {path})")
                      return {"errors": json.loads(err) if err.startswith("{") else err}
                  raise SystemExit(f"{method} {url} -> HTTP {e.code}\n{err}") from e

          apps = request("GET", "/v1/apps", params={"limit": "200"})["data"]
          app = next(a for a in apps if a["attributes"].get("bundleId") == "com.magnexis.maps")
          app_id = app["id"]
          print(f"app={app['attributes']['name']} id={app_id}")

          groups = request("GET", "/v1/betaGroups", params={"filter[app]": app_id, "limit": "50"})["data"]
          internal = next((g for g in groups if g["attributes"].get("isInternalGroup")), None)
          if not internal:
              raise SystemExit("No internal beta group found")
          internal_id = internal["id"]
          print(f"internal group={internal['attributes']['name']} id={internal_id}")

          builds = request("GET", "/v1/builds", params={"filter[app]": app_id, "limit": "5", "sort": "-uploadedDate"})["data"]
          build = builds[0]
          build_id = build["id"]
          print(f"buildNumber={build['attributes'].get('version')} processing={build['attributes'].get('processingState')} id={build_id}")

          # --- Reset stuck Internal INVITED tester ---
          found = request("GET", "/v1/betaTesters", params={"filter[email]": target, "limit": "10"}).get("data", [])
          for t in found:
              tid = t["id"]
              print(f"deleting stuck tester id={tid} state={t['attributes'].get('state')}")
              request("DELETE", f"/v1/betaTesters/{tid}", ok_statuses=(404,))
              time.sleep(2)

          print(f"creating fresh beta tester {target} on internal group...")
          created = request("POST", "/v1/betaTesters", body={
              "data": {
                  "type": "betaTesters",
                  "attributes": {
                      "email": target,
                      "firstName": "Matthew",
                      "lastName": "Looney",
                  },
                  "relationships": {
                      "betaGroups": {"data": [{"type": "betaGroups", "id": internal_id}]},
                  },
              }
          })
          tester_id = created["data"]["id"]
          print(f"created tester id={tester_id} state={created['data']['attributes'].get('state')}")

          print("posting betaTesterInvitations...")
          inv = request("POST", "/v1/betaTesterInvitations", body={
              "data": {
                  "type": "betaTesterInvitations",
                  "relationships": {
                      "app": {"data": {"type": "apps", "id": app_id}},
                      "betaTester": {"data": {"type": "betaTesters", "id": tester_id}},
                  },
              }
          }, ok_statuses=(409,))
          print("invite:", json.dumps(inv, indent=2)[:1200])

          # --- External public link (gives redeem URL/code; may need Beta Review) ---
          external = next((g for g in groups if not g["attributes"].get("isInternalGroup") and g["attributes"].get("name") == "Public Link"), None)
          if not external:
              print("creating External group 'Public Link'...")
              external = request("POST", "/v1/betaGroups", body={
                  "data": {
                      "type": "betaGroups",
                      "attributes": {
                          "name": "Public Link",
                          "isInternalGroup": False,
                          "publicLinkEnabled": True,
                          "publicLinkLimitEnabled": True,
                          "publicLinkLimit": 100,
                          "feedbackEnabled": True,
                      },
                      "relationships": {
                          "app": {"data": {"type": "apps", "id": app_id}},
                      },
                  }
              })["data"]
          else:
              print(f"external group exists id={external['id']}")
              # enable public link if needed
              if not external["attributes"].get("publicLinkEnabled"):
                  external = request("PATCH", f"/v1/betaGroups/{external['id']}", body={
                      "data": {
                          "type": "betaGroups",
                          "id": external["id"],
                          "attributes": {
                              "publicLinkEnabled": True,
                              "publicLinkLimitEnabled": True,
                              "publicLinkLimit": 100,
                          },
                      }
                  })["data"]

          ext_id = external["id"]
          # refresh attributes for publicLink
          external = request("GET", f"/v1/betaGroups/{ext_id}")["data"]
          atr = external["attributes"]
          print(f"PUBLIC_LINK_ENABLED={atr.get('publicLinkEnabled')}")
          print(f"PUBLIC_LINK={atr.get('publicLink')}")
          print(f"PUBLIC_LINK_ID={atr.get('publicLinkId')}")

          # try attach build to external group (may 422 until beta review)
          print("attaching build to Public Link group (may require Beta App Review)...")
          request("POST", f"/v1/betaGroups/{ext_id}/relationships/builds", body={
              "data": [{"type": "builds", "id": build_id}]
          }, ok_statuses=(409, 422))

          # submit for beta review if needed
          print("checking/submitting Beta App Review...")
          request("POST", "/v1/betaAppReviewSubmissions", body={
              "data": {
                  "type": "betaAppReviewSubmissions",
                  "relationships": {
                      "build": {"data": {"type": "builds", "id": build_id}},
                  },
              }
          }, ok_statuses=(409, 422))

          print("\n=== ACTION FOR YOU ===")
          print(f"1) Gmail ({target}) -> All Mail / Spam, search: from:email.apple.com TestFlight")
          if atr.get("publicLink"):
              print(f"2) Or open this public redeem link on the iPhone: {atr.get('publicLink')}")
              print(f"   Redeem code (if TestFlight asks): {atr.get('publicLinkId')}")
          else:
              print("2) Public link not active yet — after Beta Review finishes, re-run this workflow or enable Public Link in ASC External Testing.")
          print("3) TestFlight on iPhone must be signed into", target)
          PY
