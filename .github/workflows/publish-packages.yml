# Publish @magnexis/shared and @magnexis/api-client to GitHub Packages.
name: Publish packages

on:
  push:
    tags:
      - "api-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@magnexis"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @magnexis/shared --filter @magnexis/api-client build
      - name: Configure GitHub Packages auth
        run: |
          echo "@magnexis:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @magnexis/shared
        run: pnpm --filter @magnexis/shared publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @magnexis/api-client
        run: pnpm --filter @magnexis/api-client publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
