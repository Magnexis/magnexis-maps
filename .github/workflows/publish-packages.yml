# Publish @magnexis/shared and @magnexis/api-client to GitHub Packages.
# Tag example: api-v1.1.0 (version in the tag must match package.json).
name: Publish packages

on:
  push:
    tags:
      - "api-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Package version tag already on the commit (e.g. api-v1.1.0)"
        required: true
        default: "api-v1.1.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@magnexis"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#api-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHARED=$(node -p "require('./packages/shared/package.json').version")
          CLIENT=$(node -p "require('./packages/api-client/package.json').version")
          if [ "$SHARED" != "$VERSION" ] || [ "$CLIENT" != "$VERSION" ]; then
            echo "Tag version $VERSION must match packages/shared ($SHARED) and packages/api-client ($CLIENT)"
            exit 1
          fi
      - name: Build
        run: pnpm --filter @magnexis/shared --filter @magnexis/api-client build
      - name: Configure GitHub Packages auth
        run: |
          echo "@magnexis:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @magnexis/shared
        run: pnpm --filter @magnexis/shared publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @magnexis/api-client
        run: pnpm --filter @magnexis/api-client publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
