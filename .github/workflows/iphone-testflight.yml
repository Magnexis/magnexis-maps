name: iPhone TestFlight

# Manual-only upload to App Store Connect / TestFlight.
# Kept separate from iphone.yml so push CI never shows a skipped testflight job.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONE_API_URL: https://magnexis-maps.netlify.app
  IPHONE_SHARE_URL: https://magnexis-maps.netlify.app
  IPHONE_PRIVACY_URL: https://magnexis-maps.netlify.app/privacy/
  IPHONE_SUPPORT_URL: https://magnexis-maps.netlify.app/support/

jobs:
  testflight:
    # App Store Connect requires the iOS 26 SDK (Xcode 26+).
    runs-on: macos-26
    timeout-minutes: 90
    environment: app-store
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and ensure the iOS device SDK
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # Glob order picks Xcode_26.0.1 first; prefer the newest 26.x on the image.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${XCODE_APP}" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_APP=/Applications/Xcode.app
          fi
          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode 26+ install found on this runner."
            exit 1
          fi
          echo "Selecting ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcodebuild -showsdks || true
          # Warm CoreSimulator before -downloadPlatform; otherwise GH runners often fail with
          # "Unable to connect to simulator" (exit 70). See actions/runner-images#12862 / #13459.
          xcrun simctl list >/dev/null 2>&1 || true
          # Do not probe destinations against the Xcode project here: SPM/Capacitor packages
          # live under node_modules and are not installed yet. "already downloaded" is success.
          echo "Ensuring iOS device platform is present..."
          DOWNLOAD_LOG="$(mktemp)"
          if xcodebuild -downloadPlatform iOS >"$DOWNLOAD_LOG" 2>&1; then
            cat "$DOWNLOAD_LOG"
          else
            cat "$DOWNLOAD_LOG"
            if grep -Eqi 'already downloaded|is already installed' "$DOWNLOAD_LOG"; then
              echo "iOS platform already present; continuing."
            else
              echo "xcodebuild -downloadPlatform iOS failed."
              exit 1
            fi
          fi
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test -d "$SDK_PATH"
          echo "iphoneos SDK ${SDK_VERSION} at ${SDK_PATH}"
      - name: Verify signing prerequisites without printing credentials
        shell: bash
        run: |
          for name in IOS_TEAM_ID IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing GitHub app-store environment setting: $name"; exit 1; fi
          done
          echo "All app-store signing prerequisites are present (values not printed)."
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production web bundle and sync Capacitor
        run: |
          pnpm exec tsc -b packages/shared packages/api-client packages/map-styles packages/navigation
          pnpm --filter @magnexis/iphone build
          pnpm --filter @magnexis/iphone sync
          pnpm --filter @magnexis/iphone release:check
      - name: Install signing assets into an ephemeral keychain
        run: bash apps/iphone/scripts/ci-signing.sh install
      - name: Archive Release build for App Store (device SDK)
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "Using code sign identity: ${MAPS_CODE_SIGN_IDENTITY:?signing identity was not detected}"
          # Destinations are only meaningful after pnpm install + Capacitor sync (local SPM packages).
          DEST_LOG="$(xcodebuild -showdestinations -scheme App -project apps/iphone/ios/App/App.xcodeproj 2>&1 || true)"
          echo "$DEST_LOG" | grep -E 'platform:iOS|Any iOS Device|error:' || true
          if echo "$DEST_LOG" | grep 'name:Any iOS Device' | grep -q 'error:'; then
            echo "iOS device destination still reports an error after SDK install."
            exit 1
          fi
          xcodebuild -showBuildSettings -project apps/iphone/ios/App/App.xcodeproj -scheme App -configuration Release \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|IPHONEOS_DEPLOYMENT_TARGET|SDKROOT' || true
          xcodebuild \
            -project apps/iphone/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maps.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MAPS_CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$MAPS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            ONLY_ACTIVE_ARCH=NO \
            archive
          test -d "$RUNNER_TEMP/Maps.xcarchive/Products/Applications/App.app"
          echo "Archive created at $RUNNER_TEMP/Maps.xcarchive"
      - name: Export signed IPA for App Store Connect
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Maps.xcarchive" \
            -exportPath "$RUNNER_TEMP/MapsExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(find "$RUNNER_TEMP/MapsExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          test -f "$IPA"
          BYTES=$(wc -c < "$IPA" | tr -d ' ')
          echo "Exported signed IPA ($(basename "$IPA"), ${BYTES} bytes)"
          if [ "$BYTES" -lt 1000000 ]; then
            echo "IPA is unexpectedly small; refusing to upload a stub."
            exit 1
          fi
          echo "MAPS_IPA=$IPA" >> "$GITHUB_ENV"
          codesign -dv --verbose=2 "$RUNNER_TEMP/Maps.xcarchive/Products/Applications/App.app" 2>&1 | grep -E 'Identifier=|Authority=|TeamIdentifier=' || true
      - name: Validate and upload IPA to App Store Connect
        run: |
          set -euo pipefail
          test -f "$MAPS_IPA"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          test -f "$KEY_PATH"
          echo "Validating IPA with App Store Connect API key (key file present, contents not printed)…"
          xcrun altool --validate-app \
            -f "$MAPS_IPA" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Uploading signed IPA to App Store Connect…"
          xcrun altool --upload-app \
            -f "$MAPS_IPA" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Upload submitted. Wait for App Store Connect processing before TestFlight or App Review."
      - name: Remove temporary signing assets
        if: always()
        run: bash apps/iphone/scripts/ci-signing.sh cleanup
