# Build Windows NSIS/MSI installers and publish them on a desktop-v* GitHub Release.
name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or refresh (e.g. desktop-v1.0.0)"
        required: true
        default: "desktop-v1.0.0"

permissions:
  contents: write

env:
  NEXT_PUBLIC_API_URL: https://magnexis-maps.netlify.app
  NEXT_PUBLIC_SHARE_URL: https://magnexis-maps.netlify.app
  NEXT_PUBLIC_PRIVACY_URL: https://magnexis-maps.netlify.app/privacy/
  NEXT_PUBLIC_SUPPORT_URL: https://magnexis-maps.netlify.app/support/

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#desktop-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Prefer the release tag when it exists; fall back to the dispatching SHA
          # so workflow_dispatch can refresh desktop-v1.0.0 after workflow fixes land.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Verify desktop package version
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "Tag version $VERSION must match apps/desktop package.json ($PKG)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TypeScript packages
        run: pnpm exec tsc -b packages/shared packages/api-client packages/map-styles packages/navigation

      - name: Build Windows installers (NSIS + MSI)
        run: pnpm --filter @magnexis/desktop build:windows

      - name: Collect installer artifacts
        id: artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=(
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No NSIS/MSI artifacts found under bundle/"
            find apps/desktop/src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          cp -v "${files[@]}" release-assets/
          ls -la release-assets/

      - name: Prepare release notes
        shell: bash
        run: |
          NOTES="apps/desktop/RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            cat > release-notes.md <<EOF
          # Magnexis Maps Desktop ${{ steps.meta.outputs.version }}

          Windows NSIS and MSI installers are attached to this release.
          The app embeds a static Horizon UI build and uses
          \`https://magnexis-maps.netlify.app\` for API traffic.

          Installers are unsigned; SmartScreen may warn on first run.
          EOF
          fi

      - name: Create or update GitHub Release with installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Desktop ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Desktop ${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-assets/* --clobber
